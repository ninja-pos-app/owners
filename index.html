<style>
  :root{--black:#221E1F;--card:#2C2728;--line:#4E4A4B;--green:#6DBE45;--gold:#CBA56A;--white:#FFFFFF;--muted:#B9B4B5;--danger:#F07167;--amber:#E9B949;--on-primary:#221E1F;--field:#1a1718;--bar:rgba(34,30,31,.96);--forest:color-mix(in srgb,var(--green) 45%,#0b120a);color-scheme:dark}
  html[data-mode=light]{--black:#F5F6F4;--card:#FFFFFF;--line:#DFE5D9;--white:#221E1F;--muted:#5F6B57;--danger:#B3261E;--amber:#8A6116;--field:#FFFFFF;--bar:rgba(255,255,255,.96);color-scheme:light}
  .brand img{width:34px;height:34px;border-radius:9px;background:#fff;object-fit:contain;padding:2px}
  .credit{font-size:11px;color:var(--muted);text-align:center;margin:18px 0 0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--black);color:var(--white);font-family:Montserrat,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  button,input,textarea{font:inherit}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--green);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:20px}
  .brand b{display:block;font-weight:800;letter-spacing:.14em;font-size:15px}
  .brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;font-weight:500}
  .icon-btn{background:transparent;color:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;font-weight:700;font-size:13px}
  main{padding:14px 16px 110px;max-width:640px;margin:0 auto}
  h1{font-weight:800;font-size:24px;margin:6px 0 4px}
  h2{font-weight:700;font-size:15px;margin:0 0 10px}
  .sync{font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
  .dot.stale{background:var(--amber)} .dot.none{background:var(--danger)}
  .banner{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:12px}
  .banner.warn{background:rgba(233,185,73,.12);border:1px solid rgba(233,185,73,.5)}
  .banner.err{background:rgba(240,113,103,.12);border:1px solid rgba(240,113,103,.5)}
  .banner.ok{background:rgba(109,190,69,.12);border:1px solid rgba(109,190,69,.5)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .hero{background:linear-gradient(145deg,var(--forest),#1d3d27);border:0}
  .hero span{font-size:12px;color:#d9ecd0;font-weight:500}
  .hero strong{display:block;font-size:34px;font-weight:800;margin:6px 0 10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stats div{background:rgba(0,0,0,.18);border-radius:10px;padding:8px}
  .stats b{display:block;font-size:15px}.stats small{font-size:11px;color:#d9ecd0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(78,74,75,.6)}
  .row:first-of-type{border-top:0}
  .row small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .row strong{white-space:nowrap;font-weight:700}
  .low{color:var(--danger)} .ok-txt{color:var(--green)} .gold{color:var(--gold)}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:3px 8px;background:rgba(255,255,255,.08)}
  .pill.pending{background:rgba(233,185,73,.18);color:var(--amber)} .pill.imported{background:rgba(109,190,69,.18);color:var(--green)} .pill.rejected{background:rgba(240,113,103,.18);color:var(--danger)}
  .bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:6px}
  .bars div{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
  .bars div.today{background:var(--gold);opacity:1}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 12px}
  label{display:block;font-size:13px;font-weight:700;margin:12px 0 0}
  input,textarea{display:block;width:100%;margin-top:6px;background:var(--field);color:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
  textarea{min-height:70px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--green);border-color:transparent}
  .primary{width:100%;margin-top:16px;min-height:50px;background:var(--green);color:var(--on-primary);border:0;border-radius:12px;font-weight:800;font-size:16px}
  .primary:disabled{opacity:.5}
  .link{background:none;border:0;color:var(--green);font-weight:700;padding:4px 0;font-size:12.5px;text-decoration:underline}
  .search{margin-bottom:10px}
  nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav button{background:none;border:0;color:var(--muted);min-height:54px;font-size:12px;font-weight:700;border-radius:10px}
  nav button span{display:block;font-size:18px;margin-bottom:2px}
  nav button[aria-current=page]{color:var(--green);background:rgba(109,190,69,.1)}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;padding:16px}
  .viewer img{max-width:100%;max-height:80vh;object-fit:contain;margin:auto;border-radius:8px}
  .empty{color:var(--muted);font-size:13px;margin:4px 0}
  .item-row{width:100%;background:none;border:0;border-top:1px solid rgba(78,74,75,.6);color:inherit;text-align:left;cursor:pointer;min-height:56px;font:inherit}
  .item-row:first-of-type{border-top:0}
  .item-row:active{background:rgba(109,190,69,.08)}
  .sheet{justify-content:flex-end;padding:0;overflow:auto}
  .sheet form{margin:0;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;width:100%;align-self:center}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sheet-head h2{margin:0;font-size:18px}
  .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--field);border-radius:12px;padding:4px;margin:12px 0 4px}
  .segmented button{background:none;border:0;color:var(--muted);font-weight:700;font-size:12px;min-height:40px;border-radius:9px}
  .segmented button[aria-selected=true]{background:var(--green);color:var(--on-primary)}
  [hidden]{display:none!important}
  .top-actions{display:flex;gap:8px}
  html[lang=ar],html[lang=ar] body,html[lang=ar] button,html[lang=ar] input,html[lang=ar] textarea{font-family:Cairo,Montserrat,system-ui,sans-serif}
  html[lang=ar] .brand b{letter-spacing:.14em}
  html[dir=rtl] .item-row{text-align:right}
  .lang-btn{font-family:Cairo,Montserrat,sans-serif}
  html[lang=ar] .lang-btn{font-family:Montserrat,sans-serif}
  .num{unicode-bidi:isolate;direction:ltr;display:inline-block}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:8px}
  .swatch{border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--white);padding:8px 4px;font-size:11px;font-weight:700;min-height:64px}
  .swatch i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 6px}
  .swatch[aria-pressed=true]{border-color:var(--green)}
  .auth{max-width:420px;margin:8vh auto 0}
  .auth .mark-big{width:72px;height:72px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;background:var(--green);color:var(--on-primary);font-size:34px;font-weight:800;overflow:hidden}
  .auth .mark-big img{width:100%;height:100%;object-fit:contain;background:#fff}
  .mark img{padding:0}
  .auth h1{text-align:center}
  body.signed-out nav,body.signed-out #refresh{display:none}
  .skeleton{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>

function readFile(file) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { rej(new Error(t('cannotRead'))); }; r.readAsDataURL(file); }); }
function shrinkImage(file) {
  // Phone photos are large; resize to max 1600px JPEG so uploads are quick on mobile data.
  return readFile(file).then(function (url) { return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () { var scale = Math.min(1, 1600 / Math.max(img.width, img.height)); var c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = function () { rej(new Error(t('badImage'))); };
    img.src = url; }); });
}
function submitPurchase(e) {
  e.preventDefault();
  if (state.busy) return;
  var f = e.target, file = f.receipt.files[0];
  var purchase = { id: state.purchaseId, supplier: f.supplier.value, purchasedAt: f.purchasedAt.value, total: f.total.value, description: f.description.value, receipt: null };
  var button = f.querySelector('button[type=submit]');
  function setBusy(on) { state.busy = on; button.disabled = on; button.textContent = on ? t('saving') : t('savePurchase'); }
  setBusy(true); state.error = ''; state.message = ''; render();
  var prep = !file ? Promise.resolve(null) : file.type === 'application/pdf'
    ? (file.size > 10 * 1024 * 1024 ? Promise.reject(new Error(t('pdfTooBig'))) : readFile(file).then(function (u) { return { name: file.name, mimeType: 'application/pdf', base64: u.split(',')[1] }; }))
    : shrinkImage(file).then(function (u) { return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', base64: u.split(',')[1] }; });
  prep.then(function (receipt) { purchase.receipt = receipt; return call('purchase', { purchase: purchase }); })
    .then(function () { setBusy(false); state.purchaseId = null; state.form = null; state.message = t('purchaseSaved'); return load(); })
    .catch(function (err) {
      // Same purchase ID and form are kept, so pressing Save again cannot create a duplicate.
      setBusy(false); state.error = err.message + ' ' + t('retryPurchase'); render();
    });
}
function viewReceipt(reference) {
  var overlay = h('div', { class: 'viewer', role: 'dialog', 'aria-label': t('receipt') }, h('button', { class: 'icon-btn', type: 'button', text: t('close'), onclick: function () { overlay.remove(); } }), h('p', { class: 'note', text: t('loadingReceipt') }));
  document.body.appendChild(overlay);
  call('receipt', { reference: reference }).then(function (r) {
    overlay.lastChild.remove();
    var bytes = Uint8Array.from(atob(r.base64), function (c) { return c.charCodeAt(0); });
    var url = URL.createObjectURL(new Blob([bytes], { type: r.mimeType }));
    if (r.mimeType === 'application/pdf') overlay.appendChild(h('a', { href: url, download: r.name, class: 'primary', style: 'display:block;text-align:center;padding:14px;text-decoration:none', text: t('downloadPdf') }));
    else overlay.appendChild(h('img', { src: url, alt: t('receipt') + ' ' + reference }));
  }).catch(function (e) { overlay.lastChild.textContent = e.message; });
}
